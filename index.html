<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almascatie Family Learning</title>

    <!-- Google Fonts: Fredoka (Heading/Playful) & Nunito (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/student.css">
</head>

<body>

    <main id="app">

        <!-- =========================================
             VIEW: PILIH SISWA
        ========================================== -->
        <section id="view-student-select" class="view active">
            <div class="student-select-container">

                <header class="brand">
                    <div class="brand-badge">
                        <span class="brand-icon">🤖</span>
                    </div>
                    <h1>ALMASCATIE</h1>
                    <p>FAMILY LEARNING</p>
                </header>

                <div class="welcome">
                    <h2>Siapa kamu hari ini? ✨</h2>
                    <p>Pilih namamu untuk mulai berpetualang!</p>
                </div>

                <div id="student-list" class="student-list" aria-live="polite">
                    <div class="loading">
                        <div class="spinner">🤖</div>
                        <p>Menyiapkan petualangan...</p>
                    </div>
                </div>

                <div id="student-error" class="message error hidden"></div>

            </div>
        </section>


        <!-- =========================================
             VIEW: PIN
        ========================================== -->
        <section id="view-pin" class="view hidden">
            <div class="pin-container">

                <button id="btn-back-student" class="back-button" type="button">
                    ← Ganti Nama
                </button>

                <div class="pin-card">
                    <div id="selected-student-avatar" class="student-avatar-large">
                        👧
                    </div>

                    <h2 id="selected-student-name">Nama</h2>
                    <p id="selected-student-grade" class="grade-badge">Kelas</p>

                    <div class="pin-box">
                        <h3>Masukkan PIN Rahasia</h3>
                        <p class="pin-hint">Minta bantuan Admin jika lupa ya!</p>

                        <input
                            id="student-pin"
                            type="password"
                            inputmode="numeric"
                            pattern="[0-9]*"
                            maxlength="4"
                            autocomplete="off"
                            placeholder="••••"
                            aria-label="PIN siswa"
                        >

                        <button id="btn-login" class="primary-button" type="button">
                            🚀 Masuk Belajar
                        </button>

                        <div id="pin-error" class="message error hidden"></div>
                    </div>
                </div>

            </div>
        </section>


        <!-- =========================================
             VIEW: BERANDA SISWA
        ========================================== -->
        <section id="view-home" class="view hidden">
            <div class="student-home-container">

                <header class="home-header">
                    <div class="student-identity">
                        <div id="home-avatar" class="student-avatar">
                            👧
                        </div>
                        <div>
                            <p class="greeting">Halo, senang berjumpa lagi! 👋</p>
                            <h2 id="home-student-name">Nama</h2>
                            <span id="home-student-grade" class="grade-badge-sm">Kelas</span>
                        </div>
                    </div>
                </header>

                <div class="menu-intro">
                    <h3>Mau petualangan apa hari ini?</h3>
                </div>

                <section class="activity-menu">

                    <button class="activity-card quiz" data-activity="quiz" type="button">
                        <div class="card-icon-wrapper">🎯</div>
                        <div class="activity-content">
                            <strong>Kuis Seru</strong>
                            <small>Uji pemahaman pelajaran sekolah</small>
                        </div>
                        <span class="card-arrow">→</span>
                    </button>

                    <button class="activity-card stem" data-activity="stem" type="button">
                        <div class="card-icon-wrapper">🧠</div>
                        <div class="activity-content">
                            <strong>STEM & Logika</strong>
                            <small>Pola, urutan, puzzle & robot maze</small>
                        </div>
                        <span class="card-arrow">→</span>
                    </button>

                    <button class="activity-card timed" data-activity="timed" type="button">
                        <div class="card-icon-wrapper">⏱️</div>
                        <div class="activity-content">
                            <strong>Tantangan Waktu</strong>
                            <small>Kecepatan dan ketepatan menjawab</small>
                        </div>
                        <span class="card-arrow">→</span>
                    </button>

                </section>

            </div>
        </section>

    </main>

    <!-- Supabase & Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/dexie@4.2.0/dist/dexie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/app.js"></script>

</body>
</html>
